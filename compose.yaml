# Local development stack only - production runs on Kubernetes (ops/compose).
name: api-template

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: reload
    working_dir: /app
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: development

      # Scrubs a TUNNEL_TOKEN in `.env` from the internet-facing process - only the sidecar needs it, and it gets it as a file. Deleting this line is a silent credential leak (ops/compose).
      TUNNEL_TOKEN: ""

      LOGFIRE_SEND_TO_LOGFIRE: "false"
      LOGFIRE_PYDANTIC_PLUGIN_RECORD: "off"

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Must equal deploy.resources.limits.pids below, or Compose hard-fails (ops/compose).
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
          pids: 256

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # No `healthcheck:` here on purpose - the `reload` stage's own HEALTHCHECK is already exactly this check on this port, and a Compose one would replace it wholesale, flags included (ops/compose).
    stop_grace_period: 10s

    # Hot reload without a bind mount. Requires `up --watch` (`make docker-run-dev`); a plain `up`
    # does nothing.
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
          # The `**/` prefixes are load-bearing; without them these match almost nothing (ops/compose).
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock

    restart: unless-stopped
    networks:
      - internal

  cloudflared:
    # Public HTTPS without an inbound host port. A tunnel from this file is a DEMO LINK, never a
    # deployment, and every command naming this service needs `--profile tunnel` (ops/compose).
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    init: true
    restart: unless-stopped
    command: tunnel --metrics 127.0.0.1:2000 run --url http://app:8000
    dns:
      - 1.1.1.1
      - 8.8.8.8
    secrets:
      - tunnel_token
    environment:
      # File-based injection (cloudflared >= 2025.4.0) keeps the token out of the container env.
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel_token
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 5s
      retries: 3
    # cloudflared only dials out, so it takes a read-only rootfs; the image runs as non-root 65532.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

secrets:
  tunnel_token:
    environment: TUNNEL_TOKEN

networks:
  internal:
    driver: bridge
