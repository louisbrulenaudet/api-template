[project]
name = "backend"
version = "0.1.0"
description = "A minimal, production-ready template for building APIs with FastAPI, featuring strict data validation and Docker-based containerization, tailored for express deployment via a secure Cloudflare Tunnel."
license = "Apache-2.0"
readme = "README.md"
keywords = [
    "backend",
    "fastapi",
    "pydantic",
    "docker",
    "uvicorn",
    "python",
    "cloudflare-tunnel",
    "cloudflared",
    "async",
    "rest"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

requires-python = ">=3.14"
# The RUNTIME closure, deliberately narrower than `fastapi[standard]` (quality/uv-dependencies).
dependencies = [
    "aiocache>=0.12.3",
    "fastapi>=0.135.1",
    "httpx2[brotli,http2]>=2.7.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    # NOT prunable as "unused" - `import fastapi` raises without it (quality/uv-dependencies).
    "python-multipart>=0.0.22",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
# Everything needed to run the dev server, and nothing else - its own group so the Docker `reload`
# stage gets it without the lint/test toolchain (quality/uv-dependencies).
devserver = [
    "fastapi-cli[standard-no-fastapi-cloud-cli]>=0.0.24",
]
dev = [
    # `dev` is uv's only default group, so including `devserver` here is what keeps `make dev` and
    # `make sync` working with no extra flags.
    { include-group = "devserver" },
    "pre-commit>=4.5.1",
    "pre-commit-uv>=4.2.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.0",
    "ty>=0.0.58",
]

[tool.uv]
package = false
# One of this pin's three homes; bump all three together (quality/uv-dependencies).
required-version = ">=0.12.0"
exclude-newer = "7 days"
# Each exemption needs a reason (quality/uv-dependencies).
exclude-newer-package = { httpx2 = "0 days", httpcore2 = "0 days", ruff = "0 days" }
index-strategy = "first-index"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error"]
xfail_strict = true
markers = [
    "integration: mark test as an integration test",
    "unit: mark test as a unit test",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "ANN",
    "T20",
    "RUF",
    "FAST",
    "C4",
    "N",
    "PIE",
    "S",
    "PT",
    "LOG",
    "G",
    "ASYNC",
    "A",
    "TRY",
    "ISC",
    "DTZ",
    "RET",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "D",
    "PERF",
    "FLY",
    "ARG",
    # Ruleset names are not repeated here; run `ruff rule <code>`. These carry a policy:
    "PTH",  # prefer pathlib over os.path
    "SLF",  # no private-member access
    "PGH",  # no blanket noqa, no unspecified `type: ignore`
    "INP",  # no implicit namespace packages
    "TID",  # ban relative imports; see [tool.ruff.lint.flake8-tidy-imports]
    "C90",  # cyclomatic complexity; see [tool.ruff.lint.mccabe]
]
ignore = [
    # Line length is the formatter's job; E501 only fires on strings/comments it
    # cannot wrap (long docstrings, URLs) - advisory here, not a hard failure.
    "E501",
    # Allow long literal messages passed straight to exceptions (flake8-errmsg is off).
    "TRY003",
    # Application code, not a published library: missing docstrings are acceptable.
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    # Magic-value comparisons read fine in app code (HTTP codes, retry counts, ...).
    "PLR2004",
    # Formatter compatibility - the Ruff formatter owns these; keeping them off avoids
    # conflicts. https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "COM812",
    "ISC001",
    "ISC002",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# pytest-style checks (PT) intentionally stay ENABLED for tests.
"tests/**" = [
    "ANN",
    "ARG",
    "D",
    "E402",
    "INP",
    "S101",
    "SLF",
    "TRY",
]

[tool.ruff]
target-version = "py314"
line-length = 100
indent-width = 4
required-version = ">=0.16.0"
# Ruff already excludes .venv/.git/.ruff_cache/.pytest_cache/build/dist by default;
# extend (do not replace) that list with generated coverage/site output.
extend-exclude = ["htmlcov", "site"]
# Required, not cosmetic: without it any caller that names files directly lints generated output
# (quality/lint-and-types).
force-exclude = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
# Keeps the formatter off fenced Python in the agent-facing docs under .claude/ and .cursor/, which
# Ruff 0.16.0 would otherwise rewrite (quality/lint-and-types).
exclude = ["*.md"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
split-on-trailing-comma = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true
mypy-init-return = true

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 12
max-statements = 50

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.field_validator"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
# Enforce absolute imports from `app.*` (matches the documented import convention).
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.environment]
root = ["."]
python-platform = "linux"

[tool.ty.src]
include = ["app", "tests"]
exclude = ["**/__pycache__/"]
respect-ignore-files = true

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
possibly-missing-import = "error"
possibly-missing-attribute = "error"
missing-type-argument = "error"
blanket-ignore-comment = "error"
division-by-zero = "error"
missing-override-decorator = "error"
unsupported-dynamic-base = "error"

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    # Anchored deliberately - an unanchored "pass" also matches identifiers (quality/testing).
    "^\\s*pass$",
    "raise ImportError",
]
ignore_errors = true

[tool.fastapi]
entrypoint = "app.main:app"
