[project]
name = "backend"
version = "0.1.0"
description = "A minimal, production-ready template for building APIs with FastAPI, featuring strict data validation and Docker-based containerization, tailored for express deployment via a secure Cloudflare Tunnel."
license = "Apache-2.0"
readme = "README.md"
keywords = [
    "backend",
    "fastapi",
    "pydantic",
    "docker",
    "uvicorn",
    "python",
    "cloudflare-tunnel",
    "cloudflared",
    "async",
    "rest"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

requires-python = ">=3.14"
dependencies = [
    "aiocache>=0.12.3",
    # Same as fastapi[standard], but fastapi-cli[standard-no-fastapi-cloud-cli] omits
    # fastapi-cloud-cli / sentry-sdk (see Astral/FastAPI CLI extras).
    "fastapi-cli[standard-no-fastapi-cloud-cli]>=0.0.24",
    "fastapi>=0.135.1",
    "httpx2[brotli,http2]>=2.7.0",
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pre-commit-uv>=4.2.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.0",
    "ty>=0.0.58",
]

[tool.uv]
package = false
required-version = ">=0.11.8"
exclude-newer = "7 days"
# httpx2 sits on the outbound critical path; allow current releases past the 7-day
# freshness gate so security/perf fixes (e.g. 2.7.0) are lockable immediately.
# ruff is dev-group-only and never enters the runtime image, so its supply-chain blast
# radius differs from a runtime dependency; exempting it keeps the lint/format toolchain
# on the current release instead of trailing the soak window by a week.
exclude-newer-package = { httpx2 = "0 days", httpcore2 = "0 days", ruff = "0 days" }
index-strategy = "first-index"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error"]
xfail_strict = true
markers = [
    "integration: mark test as an integration test",
    "unit: mark test as a unit test",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-annotations
    "ANN",
    # flake8-print
    "T20",
    # Ruff-specific
    "RUF",
    # FastAPI
    "FAST",
    # flake8-comprehensions
    "C4",
    # pep8-naming
    "N",
    # flake8-pie
    "PIE",
    # flake8-bandit
    "S",
    # flake8-pytest-style
    "PT",
    # flake8-logging
    "LOG",
    # flake8-logging-format
    "G",
    # flake8-async
    "ASYNC",
    # flake8-builtins
    "A",
    # tryceratops
    "TRY",
    # flake8-implicit-str-concat
    "ISC",
    # flake8-datetimez
    "DTZ",
    # flake8-return
    "RET",
    # pylint subsets
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    # pydocstyle
    "D",
    # perflint (performance anti-patterns)
    "PERF",
    # flake8-use-pathlib (prefer pathlib over os.path)
    "PTH",
    # flynt (implicit string joins -> f-strings)
    "FLY",
    # flake8-tidy-imports (ban relative imports; see [tool.ruff.lint.flake8-tidy-imports])
    "TID",
    # flake8-no-pep420 (no implicit namespace packages)
    "INP",
    # flake8-unused-arguments
    "ARG",
    # flake8-self (no private-member access)
    "SLF",
    # pygrep-hooks (no blanket noqa / no unspecified type: ignore)
    "PGH",
    # mccabe (cyclomatic complexity; see [tool.ruff.lint.mccabe])
    "C90",
]
ignore = [
    # Line length is the formatter's job; E501 only fires on strings/comments it
    # cannot wrap (long docstrings, URLs) - advisory here, not a hard failure.
    "E501",
    # Allow long literal messages passed straight to exceptions (flake8-errmsg is off).
    "TRY003",
    # Application code, not a published library: missing docstrings are acceptable.
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    # Magic-value comparisons read fine in app code (HTTP codes, retry counts, ...).
    "PLR2004",
    # Formatter compatibility - the Ruff formatter owns these; keeping them off avoids
    # conflicts. https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "COM812",
    "ISC001",
    "ISC002",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tests: allow missing annotations/docstrings, `assert`, unused fixture args,
# private-member access, module-level import placement, and non-package dirs.
# pytest-style checks (PT) intentionally stay ENABLED here.
"tests/**" = [
    "ANN",
    "ARG",
    "D",
    "E402",
    "INP",
    "S101",
    "SLF",
    "TRY",
]

[tool.ruff]
# No `fix = true`: auto-fix stays opt-in (`ruff check --fix`) so a bare `ruff check`
# in CI reports violations instead of silently fixing them and exiting 0.
target-version = "py314"
line-length = 100
indent-width = 4
required-version = ">=0.16.0"
# Ruff already excludes .venv/.git/.ruff_cache/.pytest_cache/build/dist by default;
# extend (do not replace) that list with generated coverage/site output.
extend-exclude = ["htmlcov", "site"]
# Apply `exclude`/`extend-exclude` (and .gitignore) even to paths passed explicitly on the
# command line. Without this, any caller that names files directly - the VS Code Ruff
# extension, `hooks/quality/lint-changed.sh` (`ruff check --fix "$FILE"`) - silently lints
# generated output. The pre-commit hooks already hard-code `--force-exclude` in their entry;
# setting it here makes every entry point behave the same. https://docs.astral.sh/ruff/settings/#force-exclude
force-exclude = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
# Default is "auto" (preserve whatever each file already has); pin to LF so Windows
# contributors and the Linux container produce byte-identical output. Matches .editorconfig.
line-ending = "lf"
docstring-code-format = true
# Ruff 0.16.0 added "*.md" to the default `include` and now formats fenced ```python /
# ```py / ```pyi blocks in Markdown. That would rewrite 9 agent-facing skill/rule docs
# under .claude/ and .cursor/. Scoped to the formatter (not top-level `extend-exclude`) so
# Markdown stays discoverable if `ruff check` gains Markdown support later.
# https://docs.astral.sh/ruff/formatter/#markdown
exclude = ["*.md"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
split-on-trailing-comma = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true
mypy-init-return = true

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 12
max-statements = 50

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.field_validator"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
# Enforce absolute imports from `app.*` (matches the documented import convention).
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.environment]
root = ["."]
python-platform = "linux"

[tool.ty.src]
include = ["app", "tests"]
exclude = ["**/__pycache__/"]
respect-ignore-files = true

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
possibly-missing-import = "error"
possibly-missing-attribute = "error"
missing-type-argument = "error"
blanket-ignore-comment = "error"
division-by-zero = "error"
missing-override-decorator = "error"
unsupported-dynamic-base = "error"

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    # Anchored: these are unanchored regexes matched against the whole line, and a bare "pass"
    # also matches any identifier containing it - `ProbeBypassMiddleware`, `password`,
    # `passthrough` - which excludes that line AND the block it introduces. A whole class then
    # vanishes from the 100% gate while still reporting 100%.
    "^\\s*pass$",
    "raise ImportError",
]
ignore_errors = true

[tool.fastapi]
entrypoint = "app.main:app"
