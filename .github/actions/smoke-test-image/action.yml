name: Smoke test runtime image
description: >-
  Run the image under the hardening it is meant to tolerate - read-only rootfs, all capabilities dropped, no new privileges - and assert it serves, satisfies its own HEALTHCHECK, still rejects an unlisted Host on non-probe paths, runs unprivileged, hides /docs in production, and ships neither uv, fastapi-cli nor pip. An image that builds but cannot serve a request is not a passing build.

inputs:
  image:
    description: Image reference to run, e.g. api-template:runtime.
    required: true
  port:
    description: Port the image serves. Must match the stage's own EXPOSE/CMD.
    required: false
    default: "8001"
  expected-uid:
    description: UID the container must run as.
    required: false
    default: "10001"
  timeout-seconds:
    description: How long to wait for the first healthy response.
    required: false
    default: "30"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        PORT: ${{ inputs.port }}
        EXPECTED_UID: ${{ inputs.expected-uid }}
        TIMEOUT: ${{ inputs.timeout-seconds }}
        # Only probe paths may be curled without this as `Host` (ops/ci).
        ALLOWED_HOST: example.com
      run: |
        # Required: a failed assertion below would otherwise skip the cleanup and leave the container
        # holding the published port, failing the next run on a name conflict.
        trap 'docker rm --force smoke >/dev/null 2>&1 || true' EXIT

        docker run --rm --detach --name smoke \
          --read-only --tmpfs /tmp:size=64m,mode=1777 \
          --cap-drop ALL --security-opt no-new-privileges:true \
          --env ENVIRONMENT=production \
          --env API_KEY=ci-smoke-test-not-a-real-key \
          --env "ALLOWED_ORIGINS=https://${ALLOWED_HOST}" \
          --env "ALLOWED_HOSTS=${ALLOWED_HOST}" \
          --publish "127.0.0.1:${PORT}:${PORT}" \
          "${IMAGE}"

        # No `Host` header here, deliberately - adding one would test the probe exemption away
        # (ops/ci, backend/middleware).
        for i in $(seq 1 "${TIMEOUT}"); do
          if curl -fsS "http://127.0.0.1:${PORT}/api/v1/health" >/dev/null 2>&1; then
            echo "healthy after ${i}s"; break
          fi
          if [ "${i}" -eq "${TIMEOUT}" ]; then
            echo "::error::image never became healthy"; docker logs smoke; exit 1
          fi
          sleep 1
        done

        # The exemption must not have widened into "no host validation at all".
        code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/definitely-not-a-route")
        test "${code}" = "400" || {
          echo "::error::a non-probe path answered ${code} for an unlisted Host, expected 400"
          exit 1; }

        # A separate assertion from the poll above, and not redundant with it (ops/ci).
        for i in $(seq 1 "${TIMEOUT}"); do
          status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
          if [ "${status}" = "healthy" ]; then
            echo "HEALTHCHECK reported healthy after ${i}s"; break
          fi
          if [ "${i}" -eq "${TIMEOUT}" ]; then
            echo "::error::HEALTHCHECK never reported healthy (last status: ${status})"
            docker logs smoke; exit 1
          fi
          sleep 1
        done

        echo "runtime uid/gid: $(docker exec smoke id -u):$(docker exec smoke id -g)"
        test "$(docker exec smoke id -u)" = "${EXPECTED_UID}" || {
          echo "::error::container is not running as UID ${EXPECTED_UID}"; exit 1; }

        # Not a probe path, so this one presents the Host header a legitimate client would.
        code=$(curl -s -o /dev/null -w '%{http_code}' \
          -H "Host: ${ALLOWED_HOST}" "http://127.0.0.1:${PORT}/docs")
        test "${code}" = "404" || {
          echo "::error::/docs returned ${code}, expected 404 in production"; exit 1; }

        # Three things must be absent from the runtime stage, all probed through `python` rather than
        # `sh -c 'command -v …'`. This preamble proves exec works at all - without it every absence
        # assertion below would fail open (ops/ci).
        docker exec smoke python -c 'pass' || {
          echo "::error::cannot exec in the container; the absence assertions would fail open"; exit 1; }

        if docker exec smoke python -c "import shutil,sys; sys.exit(0 if shutil.which('uv') else 1)"; then
          echo "::error::uv is present in the runtime image"; exit 1
        fi

        # Probe the MODULE, never `shutil.which('fastapi')`: `fastapi` itself declares the `fastapi`
        # console script (`fastapi.cli:main`), an inert stub that raises unless `fastapi_cli` is
        # importable, so the script is on PATH in every image that ships FastAPI at all and probing
        # it asserts nothing. `fastapi_cli` is what drags typer/rich/shellingham in, so finding it
        # here means it moved back into `[project] dependencies` (quality/uv-dependencies).
        if docker exec smoke python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('fastapi_cli') else 1)"; then
          echo "::error::fastapi-cli is present in the runtime image"; exit 1
        fi

        # Absolute path to the SYSTEM interpreter, not bare `python` (the venv never had pip). Module
        # and dist-info are separate failures and both matter (ops/composite-actions, ops/dockerfile).
        if docker exec smoke /usr/local/bin/python3 -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('pip') else 1)"; then
          echo "::error::pip is still importable in the runtime image's system interpreter"; exit 1
        fi
        if docker exec smoke /usr/local/bin/python3 -c "import glob,sys,sysconfig; sys.exit(0 if glob.glob(sysconfig.get_paths()['purelib'] + '/pip-*.dist-info') else 1)"; then
          echo "::error::pip is gone but its dist-info remains; CVE scanners will still report pip"
          exit 1
        fi

        docker logs smoke
        docker stop --timeout 30 smoke
