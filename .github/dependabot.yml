# Dependabot version updates. The absent options (`cooldown`, `labels`, group `dependency-type`) are each
# absent on purpose - see ops/dependabot before adding any of them.
version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  # The Dockerfile's `python:` and `ghcr.io/astral-sh/uv:` FROM lines. A uv bump here moves only one of
  # that pin's three homes (ops/dependabot, quality/uv-dependencies).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
    groups:
      compose-images:
        patterns: ["*"]
