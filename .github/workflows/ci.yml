name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  LOGFIRE_SEND_TO_LOGFIRE: "false"
  LOGFIRE_PYDANTIC_PLUGIN_RECORD: "off"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - parallel:
          - name: Check formatting with Ruff
            run: uv run --frozen ruff format --check .

          - name: Lint with Ruff
            run: uv run --frozen ruff check .

          - name: Type check with ty
            run: uv run --frozen ty check --output-format github

          - name: Run tests with pytest
            run: uv run --frozen pytest -q

  docker-lint:
    name: Dockerfile and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - parallel:
          - name: Run Docker build checks
            run: make docker-check-build

          - name: Validate Compose
            run: make docker-config

  docker-build:
    name: Build runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `load: true` imports into the local daemon so the smoke test steps below can run the image.
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: api-template:runtime
          # The commit SHA, not `github.ref_name`: a ref name is attacker-influenceable and may
          # legally contain shell metacharacters, so using it would require sanitizing it first. A
          # SHA needs none, and it is the more useful provenance value anyway.
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the runtime image
        uses: ./.github/actions/smoke-test-image
        with:
          image: api-template:runtime
          port: "8001"

      - name: Assert no credentials baked into image layers
        uses: ./.github/actions/assert-no-baked-credentials
        with:
          image: api-template:runtime
