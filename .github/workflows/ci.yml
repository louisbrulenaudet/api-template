name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

env:
  LOGFIRE_SEND_TO_LOGFIRE: "false"
  LOGFIRE_PYDANTIC_PLUGIN_RECORD: "off"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - parallel:
          - name: Run lint with ruff
            run: uv run --frozen ruff check .
          - name: Run type check with ty
            run: uv run --frozen ty check . --output-format github
          - name: Run tests with pytest
            run: uv run --frozen pytest -q

  docker-build:
    name: Build runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          tags: backend:runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max
